<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora · Visual Music Player</title>
<style>
  :root{
    --bg:#070912;
    --bg2:#0d1024;
    --panel:rgba(20,24,48,.55);
    --line:rgba(120,140,255,.18);
    --txt:#e8ecff;
    --dim:#8893b8;
    --c1:#22d3ee;   /* 青 */
    --c2:#a855f7;   /* 紫 */
    --c3:#f43f5e;   /* 玫红 */
    --c4:#facc15;   /* 金 */
    --accent:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(900px 600px at 20% -10%,color-mix(in srgb,var(--c2) 18%,transparent),transparent 60%),
      radial-gradient(800px 600px at 100% 110%,color-mix(in srgb,var(--c1) 16%,transparent),transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg));
    overflow:hidden;
    user-select:none;
  }

  .app{
    display:grid;
    grid-template-columns:300px 1fr;
    grid-template-rows:1fr 96px;
    grid-template-areas:"side stage" "side ctrl";
    height:100vh;
    gap:14px;
    padding:14px;
  }

  /* ---------- 侧栏：播放列表 ---------- */
  .sidebar{
    grid-area:side;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(14px);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .side-head{
    padding:16px 16px 10px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .side-head h1{
    margin:0;font-size:15px;letter-spacing:1px;font-weight:700;
    background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .add-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--txt);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:12px;
    transition:.18s;
  }
  .add-btn:hover{background:color-mix(in srgb,var(--c2) 25%,transparent);border-color:var(--c2)}
  .list{flex:1;overflow-y:auto;padding:8px}
  .list::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb{background:rgba(120,140,255,.3);border-radius:8px}
  .track{
    display:flex;align-items:center;gap:10px;
    padding:10px 10px;border-radius:12px;cursor:pointer;margin-bottom:4px;
    border:1px solid transparent;transition:.15s;
  }
  .track:hover{background:rgba(255,255,255,.05)}
  .track.active{background:color-mix(in srgb,var(--c2) 18%,transparent);border-color:color-mix(in srgb,var(--c2) 40%,transparent)}
  .track .idx{width:22px;text-align:center;font-size:12px;color:var(--dim);flex:none}
  .track.active .idx{color:var(--c1)}
  .track .meta{flex:1;min-width:0}
  .track .name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .dur{font-size:11px;color:var(--dim)}
  .track .eq{width:14px;flex:none;display:flex;align-items:flex-end;gap:2px;height:14px;opacity:0}
  .track.active.playing .eq{opacity:1}
  .eq i{width:2px;background:var(--c1);border-radius:1px;height:40%}
  .track .rm{
    flex:none;border:none;background:transparent;color:var(--dim);cursor:pointer;
    font-size:14px;line-height:1;padding:4px;border-radius:6px;opacity:0;transition:.15s;
  }
  .track:hover .rm{opacity:1}
  .track .rm:hover{color:var(--c3);background:rgba(244,63,94,.15)}
  .empty-hint{
    margin:auto;text-align:center;color:var(--dim);font-size:13px;padding:20px;line-height:1.8;
  }
  .empty-hint big{font-size:30px;display:block;margin-bottom:8px;opacity:.6}

  /* ---------- 主题切换 ---------- */
  .theme-bar{
    display:flex;gap:8px;align-items:center;justify-content:center;
    padding:12px 10px;border-top:1px solid var(--line);flex:none;
  }
  .theme-bar .sw{
    width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.18);
    cursor:pointer;padding:0;transition:.15s;position:relative;
  }
  .theme-bar .sw:hover{transform:scale(1.12)}
  .theme-bar .sw.on{border-color:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 60%,transparent)}
  .theme-bar .sw.on::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    box-shadow:0 0 12px 2px rgba(255,255,255,.5);
  }

  /* ---------- 主舞台：可视化 ---------- */
  .stage{
    grid-area:stage;position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    backdrop-filter:blur(6px);
  }
  #viz{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stage-overlay{
    position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;padding:18px;
  }
  .now-playing{pointer-events:none}
  .now-playing .title{font-size:22px;font-weight:700;letter-spacing:.5px;
    text-shadow:0 2px 18px rgba(0,0,0,.6);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-playing .sub{font-size:12px;color:var(--dim);margin-top:4px}
  .mode-bar{align-self:flex-end;pointer-events:auto;display:flex;gap:6px}
  .mode-bar button{
    border:1px solid var(--line);background:rgba(8,10,24,.5);color:var(--dim);
    border-radius:10px;padding:7px 12px;cursor:pointer;font-size:12px;transition:.15s;
  }
  .mode-bar button:hover{color:var(--txt);border-color:var(--c2)}
  .mode-bar button.on{color:#fff;background:color-mix(in srgb,var(--c2) 30%,transparent);border-color:var(--c2)}

  .drop-hint{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--dim);font-size:15px;gap:14px;pointer-events:none;transition:.2s;
  }
  .drop-hint .ico{font-size:46px;opacity:.5}
  .drop-hint.hide{opacity:0;transform:scale(.96)}
  .stage.drag{border-color:var(--c1);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 40%,transparent) inset}
  .stage.drag .drop-hint{color:var(--c1);transform:scale(1.04)}

  /* ---------- 底部控制栏 ---------- */
  .controls{
    grid-area:ctrl;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(14px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:0 18px;gap:16px;
  }
  .time-block{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .seek-wrap{display:flex;align-items:center;gap:10px;width:100%}
  .seek{
    flex:1;height:6px;border-radius:6px;cursor:pointer;
    background:rgba(255,255,255,.1);position:relative;overflow:hidden;
  }
  .seek-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:6px}
  .seek input{position:absolute;inset:-8px 0;width:100%;opacity:0;cursor:pointer;margin:0}
  .center-controls{display:flex;align-items:center;gap:10px}
  .ctrl-btn{
    border:none;background:transparent;color:var(--txt);cursor:pointer;
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-size:16px;transition:.15s;
  }
  .ctrl-btn:hover{background:rgba(255,255,255,.08)}
  .ctrl-btn.play{
    width:52px;height:52px;font-size:20px;
    background:var(--accent);color:#0a0c18;box-shadow:0 6px 22px color-mix(in srgb,var(--c2) 40%,transparent);
  }
  .ctrl-btn.play:hover{transform:scale(1.06)}
  .vol-block{display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .vol-block input[type=range]{
    width:90px;accent-color:var(--c2);
  }
  .vol-icon{font-size:14px;color:var(--dim)}

  .toast{
    position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:rgba(15,18,40,.95);border:1px solid var(--line);color:var(--txt);
    padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-areas:"stage" "ctrl" "side";grid-template-rows:1fr 96px 180px}
    .vol-block input[type=range]{width:60px}
  }
</style>
</head>
<body>

<div class="app">
  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="side-head">
      <h1>♪ PLAYLIST</h1>
      <button class="add-btn" id="addBtn">＋ 添加</button>
    </div>
    <div class="list" id="list">
      <div class="empty-hint" id="listEmpty">
        <big>♫</big>
        还没有音乐<br>点击「添加」或拖入 MP3
      </div>
    </div>
    <div class="theme-bar" id="themeBar" title="切换主题配色"></div>
  </aside>

  <!-- 主舞台 -->
  <main class="stage" id="stage">
    <canvas id="viz"></canvas>
    <div class="drop-hint" id="dropHint">
      <div class="ico">🎧</div>
      <div>拖入 MP3 文件，或点击右下角「添加」</div>
    </div>
    <div class="stage-overlay">
      <div class="now-playing">
        <div class="title" id="npTitle">未在播放</div>
        <div class="sub" id="npSub">等待你上传音频</div>
      </div>
      <div class="mode-bar">
        <button data-mode="fusion" class="on">融合</button>
        <button data-mode="ring">环形</button>
        <button data-mode="bars">频谱</button>
        <button data-mode="wave">波形</button>
      </div>
    </div>
  </main>

  <!-- 控制栏 -->
  <footer class="controls">
    <div class="seek-wrap">
      <span class="time-block"><span id="curTime">0:00</span></span>
      <div class="seek" id="seek">
        <div class="seek-fill" id="seekFill"></div>
        <input type="range" id="seekInput" min="0" max="1000" value="0" step="1">
      </div>
      <span class="time-block"><span id="totTime">0:00</span></span>
    </div>

    <div class="center-controls">
      <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
      <button class="ctrl-btn play" id="playBtn" title="播放/暂停 (Space)">▶</button>
      <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
    </div>

    <div class="vol-block">
      <span class="vol-icon">🔊</span>
      <input type="range" id="volInput" min="0" max="1" step="0.01" value="0.8">
    </div>
  </footer>
</div>

<input type="file" id="fileInput" accept="audio/*,.mp3" multiple hidden>
<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  // ====== DOM ======
  const audio   = document.getElementById('audio');
  const fileIn  = document.getElementById('fileInput');
  const addBtn  = document.getElementById('addBtn');
  const listEl  = document.getElementById('list');
  const listEmpty = document.getElementById('listEmpty');
  const stage   = document.getElementById('stage');
  const dropHint= document.getElementById('dropHint');
  const canvas  = document.getElementById('viz');
  const ctx     = canvas.getContext('2d');
  const playBtn = document.getElementById('playBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const seekEl  = document.getElementById('seek');
  const seekFill= document.getElementById('seekFill');
  const seekIn  = document.getElementById('seekInput');
  const volIn   = document.getElementById('volInput');
  const curT    = document.getElementById('curTime');
  const totT    = document.getElementById('totTime');
  const npTitle = document.getElementById('npTitle');
  const npSub   = document.getElementById('npSub');
  const toastEl = document.getElementById('toast');

  // ====== 状态 ======
  let playlist = [];          // [{id,file,url,name,dur}]
  let currentId = null;
  let mode = 'fusion';        // fusion | ring | bars | wave
  let audioCtx=null, analyser=null, source=null, freq=null, wave=null;
  let rafId=null;
  let rot = 0;                // 旋转累计角
  let particles = [];
  let beatAvg = 0;            // 低频均值（平滑）
  let bassPulse = 0;          // 脉冲值

  // ====== 主题 ======
  const THEMES = {
    neon:   { name:'霓虹', c1:'#22d3ee', c2:'#a855f7', c3:'#f43f5e', c4:'#facc15', bg:'#070912', bg2:'#0d1024' },
    sunset: { name:'日落', c1:'#ff8a3c', c2:'#ff4d8d', c3:'#a855f7', c4:'#ffd166', bg:'#0c0710', bg2:'#1a0d18' },
    ocean:  { name:'深海', c1:'#38bdf8', c2:'#3b82f6', c3:'#22d3ee', c4:'#a5f3fc', bg:'#04101f', bg2:'#08203a' },
    forest: { name:'森林', c1:'#34d399', c2:'#10b981', c3:'#a3e635', c4:'#facc15', bg:'#06140d', bg2:'#0b1f17' },
    candy:  { name:'糖果', c1:'#f472b6', c2:'#c084fc', c3:'#fb7185', c4:'#fcd34d', bg:'#120a14', bg2:'#1f1024' },
    mono:   { name:'极简', c1:'#e5e7eb', c2:'#9ca3af', c3:'#6b7280', c4:'#fbbf24', bg:'#0a0a0c', bg2:'#141418' },
  };
  let theme = 'neon';
  let pal = [];        // 画布配色：[[r,g,b],...] 由 c1..c4 生成
  let bgRGB = [7,9,18]; // 当前背景色（用于拖尾清屏）

  // ====== 工具 ======
  const fmt = s => {
    if(!isFinite(s)||s<0) s=0;
    const m=Math.floor(s/60), x=Math.floor(s%60);
    return m+':'+(x<10?'0':'')+x;
  };
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1800);
  }
  function uid(){ return Math.random().toString(36).slice(2,9); }

  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function buildPal(t){ const th=THEMES[t]; pal=[hex2rgb(th.c1),hex2rgb(th.c2),hex2rgb(th.c3),hex2rgb(th.c4)]; bgRGB=hex2rgb(th.bg); }

  // 按主题调色板取色：t∈[0,1] 在 c1→c2→c3→c4→c1 间循环插值
  function palAt(t, a){
    const n=pal.length; const s=(t%1+1)%1*n; const i=Math.floor(s)%n; const j=(i+1)%n; const f=s-Math.floor(s);
    const A=pal[i], B=pal[j];
    return 'rgba('+((A[0]+(B[0]-A[0])*f)|0)+','+((A[1]+(B[1]-A[1])*f)|0)+','+((A[2]+(B[2]-A[2])*f)|0)+','+a+')';
  }
  function bgCss(a){ return 'rgba('+bgRGB[0]+','+bgRGB[1]+','+bgRGB[2]+','+a+')'; }

  function applyTheme(t){
    if(!THEMES[t]) t='neon';
    theme=t; const th=THEMES[t];
    const r=document.documentElement.style;
    r.setProperty('--c1',th.c1); r.setProperty('--c2',th.c2);
    r.setProperty('--c3',th.c3); r.setProperty('--c4',th.c4);
    r.setProperty('--bg',th.bg); r.setProperty('--bg2',th.bg2);
    buildPal(t);
    document.querySelectorAll('.theme-bar .sw').forEach(s=>s.classList.toggle('on', s.dataset.t===t));
    try{ localStorage.setItem('aurora-theme', t); }catch(e){}
  }
  function renderThemes(){
    const bar=document.getElementById('themeBar'); bar.innerHTML='';
    Object.keys(THEMES).forEach(key=>{
      const th=THEMES[key];
      const b=document.createElement('button');
      b.className='sw'; b.dataset.t=key; b.title=th.name;
      b.style.background='linear-gradient(135deg,'+th.c1+','+th.c2+','+th.c3+')';
      b.addEventListener('click', ()=>{ applyTheme(key); toast('主题：'+th.name); });
      bar.appendChild(b);
    });
  }

  // ====== 播放列表 ======
  function addFiles(files){
    const arr = Array.from(files).filter(f=>f.type.startsWith('audio/') || /\.mp3$/i.test(f.name));
    if(!arr.length){ toast('请选择音频文件（mp3 等）'); return; }
    arr.forEach(f=>{
      const url = URL.createObjectURL(f);
      const item = {id:uid(), file:f, url, name:f.name.replace(/\.[^.]+$/,''), dur:0};
      playlist.push(item);
      // 读取时长
      const tmp = new Audio(); tmp.src=url;
      tmp.addEventListener('loadedmetadata', ()=>{
        item.dur = tmp.duration; renderList();
      });
    });
    renderList();
    dropHint.classList.add('hide');
    if(currentId===null){ load(playlist[0].id, false); }
    toast('已添加 '+arr.length+' 首');
  }

  function renderList(){
    if(!playlist.length){ listEmpty.style.display='block'; listEl.innerHTML=''; listEl.appendChild(listEmpty); return; }
    listEmpty.style.display='none';
    listEl.innerHTML='';
    playlist.forEach((it,i)=>{
      const active = it.id===currentId;
      const playing = active && !audio.paused;
      const row = document.createElement('div');
      row.className='track'+(active?' active':'')+(playing?' playing':'');
      row.innerHTML = `
        <div class="idx">${String(i+1).padStart(2,'0')}</div>
        <div class="meta"><div class="name">${escapeHtml(it.name)}</div><div class="dur">${fmt(it.dur)}</div></div>
        <div class="eq"><i></i><i></i><i></i></div>
        <button class="rm" title="移除">✕</button>
      `;
      row.addEventListener('click', e=>{
        if(e.target.classList.contains('rm')) return;
        load(it.id, true);
      });
      row.querySelector('.rm').addEventListener('click', e=>{
        e.stopPropagation(); removeTrack(it.id);
      });
      listEl.appendChild(row);
    });
  }
  function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function removeTrack(id){
    const idx = playlist.findIndex(p=>p.id===id);
    if(idx<0) return;
    const it = playlist[idx];
    URL.revokeObjectURL(it.url);
    const wasCurrent = id===currentId;
    playlist.splice(idx,1);
    if(wasCurrent){
      audio.pause(); audio.removeAttribute('src'); audio.load();
      currentId=null;
      if(playlist.length){ load(playlist[Math.min(idx,playlist.length-1)].id, false); }
      else { npTitle.textContent='未在播放'; npSub.textContent='等待你上传音频'; dropHint.classList.remove('hide'); }
    }
    renderList();
  }

  function load(id, autoplay){
    const it = playlist.find(p=>p.id===id);
    if(!it) return;
    currentId = id;
    audio.src = it.url;
    audio.load();
    npTitle.textContent = it.name;
    npSub.textContent = '本地文件 · MP3';
    renderList();
    ensureAudio();
    if(autoplay) play();
    else { updatePlayBtn(); }
  }

  function currentIndex(){ return playlist.findIndex(p=>p.id===currentId); }
  function next(){ if(!playlist.length) return; let i=currentIndex()+1; if(i>=playlist.length)i=0; load(playlist[i].id,true); }
  function prev(){ if(!playlist.length) return; let i=currentIndex()-1; if(i<0)i=playlist.length-1; load(playlist[i].id,true); }

  // ====== 音频图（Web Audio） ======
  function ensureAudio(){
    if(audioCtx) return;
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      source   = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.82;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
      wave = new Uint8Array(analyser.fftSize);
    }catch(e){ console.warn('AudioContext init failed', e); }
  }

  async function play(){
    if(!currentId){ if(playlist.length) load(playlist[0].id,true); return; }
    ensureAudio();
    if(audioCtx && audioCtx.state==='suspended') await audioCtx.resume();
    try{ await audio.play(); }catch(e){ toast('无法播放：'+e.message); }
    updatePlayBtn(); renderList();
    if(!rafId) loop();
  }
  function pause(){ audio.pause(); updatePlayBtn(); renderList(); }
  function toggle(){ audio.paused ? play() : pause(); }
  function updatePlayBtn(){ playBtn.textContent = audio.paused ? '▶' : '⏸'; }

  // ====== 事件 ======
  addBtn.addEventListener('click', ()=>fileIn.click());
  fileIn.addEventListener('change', e=>{ addFiles(e.target.files); fileIn.value=''; });
  playBtn.addEventListener('click', toggle);
  nextBtn.addEventListener('click', next);
  prevBtn.addEventListener('click', prev);
  audio.addEventListener('ended', next);
  audio.addEventListener('play', ()=>{ updatePlayBtn(); renderList(); });
  audio.addEventListener('pause', ()=>{ updatePlayBtn(); renderList(); });
  audio.addEventListener('loadedmetadata', ()=>{ totT.textContent=fmt(audio.duration); });
  audio.addEventListener('timeupdate', ()=>{
    curT.textContent=fmt(audio.currentTime);
    const p = audio.duration? audio.currentTime/audio.duration:0;
    seekFill.style.width=(p*100)+'%';
    seekIn.value = Math.round(p*1000);
  });

  // 进度条
  seekIn.addEventListener('input', ()=>{
    if(!audio.duration) return;
    const p = seekIn.value/1000;
    audio.currentTime = p*audio.duration;
    seekFill.style.width=(p*100)+'%';
  });
  // 音量
  volIn.addEventListener('input', ()=>{ audio.volume = +volIn.value; });
  audio.volume = +volIn.value;

  // 模式切换
  document.querySelectorAll('.mode-bar button').forEach(b=>{
    b.addEventListener('click', ()=>{
      mode = b.dataset.mode;
      document.querySelectorAll('.mode-bar button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });

  // 拖拽上传
  let dragDepth=0;
  ['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{
    e.preventDefault(); if(ev==='dragenter')dragDepth++; stage.classList.add('drag');
  }));
  stage.addEventListener('dragleave', e=>{ dragDepth--; if(dragDepth<=0){dragDepth=0;stage.classList.remove('drag');} });
  stage.addEventListener('drop', e=>{
    e.preventDefault(); dragDepth=0; stage.classList.remove('drag');
    if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  // 整页也允许拖入
  window.addEventListener('dragover', e=>e.preventDefault());
  window.addEventListener('drop', e=>e.preventDefault());

  // 键盘
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.code==='Space'){ e.preventDefault(); toggle(); }
    else if(e.code==='ArrowRight'){ audio.currentTime=Math.min(audio.duration||0, audio.currentTime+5); }
    else if(e.code==='ArrowLeft'){ audio.currentTime=Math.max(0, audio.currentTime-5); }
    else if(e.code==='ArrowUp'){ volIn.value=Math.min(1,+volIn.value+0.05); audio.volume=+volIn.value; }
    else if(e.code==='ArrowDown'){ volIn.value=Math.max(0,+volIn.value-0.05); audio.volume=+volIn.value; }
    else if(e.code==='KeyN'){ next(); }
    else if(e.code==='KeyP'){ prev(); }
  });

  // ====== Canvas 尺寸 ======
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const r = stage.getBoundingClientRect();
    canvas.width = Math.max(2, Math.floor(r.width*dpr));
    canvas.height= Math.max(2, Math.floor(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(stage);
  resize();

  // ====== 可视化主循环 ======
  function loop(){
    rafId = requestAnimationFrame(loop);
    const W = stage.clientWidth, H = stage.clientHeight;
    if(W<2||H<2) return;

    // 取数据
    let freqArr=null, waveArr=null;
    if(analyser && !audio.paused){
      analyser.getByteFrequencyData(freq); freqArr=freq;
      analyser.getByteTimeDomainData(wave); waveArr=wave;
    }

    // 低频（贝斯）能量
    let bass=0;
    if(freqArr){ for(let i=0;i<8;i++) bass+=freqArr[i]; bass/=8*255; }
    bassPulse += (bass - bassPulse)*0.18;

    // 拖尾清屏（颜色跟随主题背景）
    ctx.fillStyle = bgCss(0.28);
    ctx.fillRect(0,0,W,H);

    const cx=W/2, cy=H/2;
    const baseR = Math.min(W,H)*0.16;
    const maxBar= Math.min(W,H)*0.26;

    // 背景径向光（随贝斯呼吸，颜色跟随主题）
    const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.5);
    glow.addColorStop(0, palAt(0.30, 0.10+bassPulse*0.22));
    glow.addColorStop(0.4, palAt(0.02, 0.05+bassPulse*0.10));
    glow.addColorStop(1, bgCss(0));
    ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);

    rot += 0.003 + bassPulse*0.02;

    if(mode==='ring' || mode==='fusion'){ drawRing(cx,cy,baseR,maxBar,freqArr); }
    if(mode==='bars' || mode==='fusion'){ drawBars(W,H,freqArr); }
    if(mode==='wave' || mode==='fusion'){ drawWave(W,H,waveArr); }
    if(mode==='fusion'){ drawCenter(cx,cy,baseR); }

    // 节拍粒子
    if(freqArr){
      beatAvg = beatAvg*0.9 + bass*0.1;
      if(bass - beatAvg > 0.18 && bass>0.45){ spawnBeat(cx,cy,baseR); }
    }
    updateParticles();
  }

  // 环形频谱
  function drawRing(cx,cy,baseR,maxBar,freqArr){
    const N=128;
    const bins = freqArr? freqArr.length : 0;
    ctx.lineWidth=2.4; ctx.lineCap='round';
    for(let i=0;i<N;i++){
      const a = i/N*Math.PI*2 - Math.PI/2 + rot;
      // 对称采样
      const idx = bins? Math.floor(Math.pow(i/N,1.4)*bins*0.7) : 0;
      const v = freqArr? freqArr[idx]/255 : 0;
      const len = v*maxBar;
      const r1 = baseR, r2 = baseR+len;
      const x1=cx+Math.cos(a)*r1, y1=cy+Math.sin(a)*r1;
      const x2=cx+Math.cos(a)*r2, y2=cy+Math.sin(a)*r2;
      const g = ctx.createLinearGradient(x1,y1,x2,y2);
      g.addColorStop(0, palAt(i/N, 0.95));
      g.addColorStop(1, palAt(i/N+0.08, 0));
      ctx.strokeStyle=g;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      // 镜像（下方对称）
      const a2 = -a - Math.PI + rot*2;
      const x3=cx+Math.cos(a2)*r1, y3=cy+Math.sin(a2)*r1;
      const x4=cx+Math.cos(a2)*r2, y4=cy+Math.sin(a2)*r2;
      ctx.beginPath(); ctx.moveTo(x3,y3); ctx.lineTo(x4,y4); ctx.stroke();
    }
  }

  // 底部柱状频谱
  function drawBars(W,H,freqArr){
    const N=64, bw=W/N;
    const bins = freqArr? freqArr.length : 0;
    for(let i=0;i<N;i++){
      const idx = bins? Math.floor(Math.pow(i/N,1.3)*bins*0.6) : 0;
      const v = freqArr? freqArr[idx]/255 : 0;
      const h = v*H*0.32;
      const x = i*bw;
      const y = H - h;
      const g = ctx.createLinearGradient(0,y,0,H);
      g.addColorStop(0, palAt(i/N*0.75, 0.9));
      g.addColorStop(1, palAt(i/N*0.75+0.18, 0.15));
      ctx.fillStyle=g;
      ctx.fillRect(x+1, y, bw-2, h);
      // 镜像倒影
      ctx.globalAlpha=0.12;
      ctx.fillRect(x+1, H, bw-2, -h*0.4);
      ctx.globalAlpha=1;
    }
  }

  // 波形线
  function drawWave(W,H,waveArr){
    if(!waveArr) return;
    const n = waveArr.length;
    ctx.lineWidth=2; ctx.strokeStyle=palAt(0.02, 0.85);
    ctx.shadowBlur=12; ctx.shadowColor=palAt(0.02, 0.6);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const x = i/(n-1)*W;
      const y = H*0.5 + (waveArr[i]-128)/128 * H*0.18;
      i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  // 中心圆盘（黑胶感）
  function drawCenter(cx,cy,baseR){
    const r = baseR*0.72 + bassPulse*8;
    // 外光
    ctx.shadowBlur=30; ctx.shadowColor=palAt(0.25, .5+bassPulse*.4);
    // 黑胶（带主题色调高光，渐隐到黑）
    const g = ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
    g.addColorStop(0, palAt(0.3, 0.42));
    g.addColorStop(0.55, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,0.9)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // 纹槽
    ctx.strokeStyle=palAt(0.25, 0.12); ctx.lineWidth=1;
    for(let i=1;i<=6;i++){
      ctx.beginPath(); ctx.arc(cx,cy, r*i/7, 0, Math.PI*2); ctx.stroke();
    }
    // 旋转的标签（颜色随旋转循环）
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(rot*4);
    ctx.fillStyle = palAt(rot*0.05, 0.9);
    ctx.beginPath(); ctx.arc(0,0,r*0.18,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 粒子
  function spawnBeat(cx,cy,baseR){
    const n = 14;
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 2+Math.random()*4;
      particles.push({
        x:cx+Math.cos(a)*baseR, y:cy+Math.sin(a)*baseR,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, t: Math.random()
      });
    }
    if(particles.length>260) particles.splice(0,particles.length-260);
  }
  function updateParticles(){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.vy*=0.97; p.life-=0.018;
      if(p.life<=0){ particles.splice(i,1); continue; }
      ctx.fillStyle=palAt(p.t, p.life);
      ctx.beginPath(); ctx.arc(p.x,p.y,2.4*p.life+0.5,0,Math.PI*2); ctx.fill();
    }
  }

  // ====== 启动 ======
  // 即使没有音频，也让背景有微弱呼吸
  function idle(){
    if(audio.paused || !analyser){
      // 仍在 loop 中，loop 会以空数据绘制呼吸光
    }
  }
  // 主题初始化
  renderThemes();
  let savedTheme='neon';
  try{ savedTheme = localStorage.getItem('aurora-theme') || 'neon'; }catch(e){}
  applyTheme(savedTheme);

  // 开启渲染循环（即便未播放，也展示待机光晕）
  loop();
})();
</script>
</body>
</html>
